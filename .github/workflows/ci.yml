name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures/basic/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The end-to-end tests run real `expo prebuild`s on this fixture.
      - run: npm ci --no-audit --no-fund
        working-directory: test/fixtures/basic
      - run: npm test
        env:
          PREBUILD_BLAME_REQUIRE_E2E: '1'
