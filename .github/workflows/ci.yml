name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures/basic/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The end-to-end tests run real `expo prebuild`s on this fixture.
      - run: npm ci --no-audit --no-fund
        working-directory: test/fixtures/basic
      - run: npm test
        env:
          PREBUILD_BLAME_REQUIRE_E2E: '1'

  # Runs this repo's own GitHub Action on the test fixture. On pull requests it
  # compares with the base branch and comments, the way users run it.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures/basic/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: test/fixtures/basic
      - id: blame
        uses: ./
        with:
          working-directory: test/fixtures/basic
          base: ${{ github.event_name == 'push' && 'HEAD~1' || '' }}
      - name: Check the outputs
        run: |
          test "${{ steps.blame.outputs.changed }}" = true -o "${{ steps.blame.outputs.changed }}" = false
          head -n 1 "${{ steps.blame.outputs.markdown-file }}" | grep -qx '<!-- prebuild-blame -->'
